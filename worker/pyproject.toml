[project]
name = "vitts-worker"
version = "0.1.0"
description = "ViTTS inference worker: thin gRPC wrapper around ZeroTTS (ADR-002)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "zerotts==0.1.5",
    "grpcio>=1.68,<2",
    "protobuf>=5.28,<6",
    "structlog>=24.4",
    "boto3>=1.35",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "grpcio-tools>=1.68",
    "boto3-stubs[s3]>=1.35",
    "types-protobuf>=5.28",
    "types-grpcio>=1.0",
    "scipy-stubs>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vitts_worker"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["vitts_worker/gen"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ASYNC", "S"]
ignore = ["S101"] # assert is how pytest asserts

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["vitts_worker/gen/"]

[[tool.mypy.overrides]]
module = ["zerotts.*"]
ignore_missing_imports = true
follow_imports = "skip"

# Generated stubs are excluded from strict checking but must stay importable, so the
# servicer base class resolves to Any rather than an error.
[[tool.mypy.overrides]]
module = ["vitts_worker.gen.*"]
ignore_missing_imports = true
follow_imports = "skip"
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = ["vitts_worker.server"]
disallow_subclassing_any = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Model tests download ~200 MB and load an ONNX session; they are opt-in via
# `pytest -m model` (or `make test-model`) so `make test` stays a unit run.
addopts = "-m 'not model'"
markers = ["model: needs the real ZeroTTS weights"]
