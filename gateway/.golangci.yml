# Linters required by docs/14-engineering-standards.md § Go.
version: "2"
linters:
  default: none
  enable:
    - bodyclose
    - contextcheck
    - errcheck
    - errorlint
    - gocritic
    - gosec
    - govet
    - revive
    - sqlclosecheck
    - staticcheck
  exclusions:
    generated: strict # internal/gen is produced by `make generate`
