# Linters required by docs/14-engineering-standards.md § Go.
version: "2"
linters:
  default: none
  enable:
    - bodyclose
    - contextcheck
    - depguard
    - errcheck
    - errorlint
    - gocritic
    - gosec
    - govet
    - revive
    - sqlclosecheck
    - staticcheck
  settings:
    depguard:
      rules:
        # Layering (.claude/rules/gateway-go.md): use cases talk to ports, never to a
        # transport or a driver. Written before the packages exist, because this cannot
        # be retrofitted cheaply once code is in them.
        use-cases:
          files:
            - "**/internal/synth/**"
            - "**/internal/jobs/**"
            - "**/internal/usage/**"
            - "**/internal/voices/**"
            - "**/internal/quota/**"
          deny:
            - pkg: net/http
              desc: use cases must not know about HTTP; adapt in internal/http
            - pkg: database/sql
              desc: use cases must not know about SQL; go through a port in internal/storage
            - pkg: github.com/jackc/pgx
              desc: use cases must not know about Postgres; go through a port
            - pkg: github.com/redis/go-redis
              desc: use cases must not know about Redis; go through a port
            - pkg: github.com/go-chi/chi
              desc: routing belongs to internal/http
  exclusions:
    generated: strict # internal/gen is produced by `make generate`
    rules:
      - path: _test\.go$
        linters:
          - gosec
