version: "2"
sql:
  - engine: postgresql
    # Schema is the migrations themselves, so a query can never drift from what is
    # deployed: sqlc fails at `make generate`, not at runtime.
    schema: migrations
    queries: internal/storage/postgres/queries
    gen:
      go:
        package: db
        out: internal/storage/postgres/db
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_db_tags: false
        emit_prepared_queries: false
        emit_interface: true
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
