[project]
name = "vitts"
version = "0.1.0"
description = "Thin client for the ViTTS Vietnamese speech API."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.9,<3",
    "anyio>=4.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "datamodel-code-generator>=0.26",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vitts"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["vitts/models.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ASYNC", "S"]
ignore = ["S101"] # assert is how pytest asserts

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.mypy]
python_version = "3.10"
strict = true
exclude = ["vitts/models.py"]

# Generated models are excluded from strict checking but must stay importable.
[[tool.mypy.overrides]]
module = ["vitts.models"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
